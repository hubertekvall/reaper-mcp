[project]
name = "reaper-mcp"
version = "0.3.0"
description = "MCP server that lets Claude and other AI assistants control the REAPER DAW"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3", "numpy>=1.26", "scipy>=1.11"]

[project.scripts]
reaper-mcp = "reaper_mcp.cli:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "lupa>=2.4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/reaper_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
